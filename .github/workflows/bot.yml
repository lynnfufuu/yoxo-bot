name: news-bot
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests pillow
      - name: Get fonts
        continue-on-error: true
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/heavy.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-ExtraBold.ttf" || rm -f fonts/heavy.ttf
          curl -fsSL -o fonts/regular.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf" || rm -f fonts/regular.ttf
      - run: python bot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git commit -m "update seen" || exit 0
          git pull --rebase
          git push
